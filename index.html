 {q:"Where are you?",opts:[
   {l:"London",t:["london"]},{l:"Elsewhere in the UK",t:[]},
   {l:"India",t:["india","outside-uk"]},{l:"Somewhere else",t:["outside-uk"]},
   {l:"Remote, anywhere",t:["remote"]}]},
 {q:"What world are you in?",opts:[
   {l:"Tech",t:["tech"]},{l:"Finance or consulting",t:["finance","consulting"]},
   {l:"Creator or media",t:["creator"]},{l:"Something else",t:["non-tech"]}]}
];
var flow={i:0,picked:[],qs:INTAKE,mode:"ask",first:0};
function renderFlow(){
  var el=document.getElementById("flow");if(!el)return;
  if(flow.i>=flow.qs.length){el.innerHTML=flowResult();return}
  var q=flow.qs[flow.i],pct=Math.round(flow.i/flow.qs.length*100);
  el.innerHTML='<div class="qwrap"><div class="prog"><i style="width:'+pct+'%"></i></div>'+
   '<p class="qn">Question '+(flow.i+1)+' of '+flow.qs.length+'</p>'+
   '<p class="qt">'+esc(q.q)+'</p><div class="opts">'+
   q.opts.map(function(o,n){return '<button class="opt" data-opt="'+n+'">'+esc(o.l)+'</button>'}).join("")+
   '</div>'+(flow.i>0?'<p class="row" style="margin-top:18px"><button class="btn-ghost btn-sm" data-back="1">Back</button></p>':'')+
   '</div>';
}
function flowResult(){
  var tags=[];flow.picked.forEach(function(x){tags=tags.concat(x||[])});
  var label=(flow.qs[0].opts[flow.first]||{}).l||"";
  if(flow.mode==="profile"){
    var u=[];tags.forEach(function(t){if(t&&u.indexOf(t)<0)u.push(t)});
    sv("pa_profile",{tags:u,at:Date.now()});
    setTimeout(function(){location.hash="#/answers";render()},10);
    return '<p class="sub">One moment\u2026</p>';
  }
  var rk=rank(tags);
  if(!sure(rk,tags)) return missHTML(label,tags);
  var r=rk[0].row;
  logReq({label:label,themes:tags,matched:r.id});
  var rel=rk.slice(1,4).map(function(x){return x.row});
  return answerHTML(r,label?("You said: "+label.toLowerCase()):"")+
    (rel.length?'<h2>You might also be asking</h2>'+qcards(rel,3):'');
}

/* ---------- evidence ---------- */
var ev={files:[]};
function isTexty(f){var n=(f.name||"").toLowerCase();
  return /\.(txt|md|csv|tsv|json|eml|html?|log|vtt|srt)$/.test(n)||
    (f.type||"").indexOf("text")===0||(f.type||"").indexOf("json")>-1}
function addFiles(list){
  Array.prototype.slice.call(list||[]).forEach(function(f){
    var rec={name:f.name,size:f.size,text:""};ev.files.push(rec);
    if(isTexty(f)&&f.size<600000){var fr=new FileReader();
      fr.onload=function(){rec.text=String(fr.result||"").slice(0,200000);paintFiles()};
      fr.onerror=paintFiles;fr.readAsText(f)}
  });paintFiles();
}
function paintFiles(){
  var el=document.getElementById("filelist");if(!el)return;
  el.innerHTML=ev.files.map(function(f,i){
    var st=f.text?("read \u2014 "+f.text.length+" characters"):(isTexty(f)?"reading\u2026":"filename only");
    return '<div class="fileitem"><div>'+esc(f.name)+'<br><span>'+esc(st)+'</span></div>'+
      '<button class="btn-ghost btn-sm" data-rm="'+i+'">Remove</button></div>'}).join("");
}
function detect(text){
  var low=(" "+text+" ").toLowerCase().replace(/\s+/g," "),out=[];
  for(var tag in LEX){var w=LEX[tag],n=0,seen=[];
    for(var i=0;i<w.length;i++) if(low.indexOf(w[i].toLowerCase())>-1){n++;if(seen.length<3)seen.push(w[i])}
    if(n) out.push({tag:tag,n:n,words:seen});}
  out.sort(function(a,b){return b.n-a.n});return out;
}
function runRead(){
  var ta=document.getElementById("paste"),out=document.getElementById("out");
  var blob=(ta?ta.value:"")+" "+ev.files.map(function(f){return f.name+" "+f.text}).join(" ");
  if(blob.replace(/\s/g,"").length<25){
    out.innerHTML='<div class="miss"><h3>There is nothing to read yet.</h3>'+
      '<p>Paste a few sentences or add a file, then try again.</p></div>';return}
  var th=detect(blob);
  if(!th.length){out.innerHTML=missHTML("pasted text",[]);return}
  var tags=th.slice(0,6).map(function(x){return x.tag});
  var rk=rank(tags);
  var head='<h2>What I think this is about</h2><div class="row" style="margin-bottom:8px">'+
    th.slice(0,8).map(function(x){return '<span class="chip'+(x.n>1?" on":"")+'">'+
      esc(pretty(x.tag))+' \u00b7 '+x.n+'</span>'}).join("")+'</div>'+
    '<p class="sub">Picked up on: '+esc(th.slice(0,4).map(function(x){return x.words.join(", ")})
      .filter(Boolean).join("; "))+'</p>';
  if(!sure(rk,tags)){out.innerHTML=head+missHTML("pasted: "+tags.slice(0,3).join(", "),tags);return}
  var r=rk[0].row;
  logReq({label:"Pasted: "+tags.slice(0,3).map(pretty).join(", "),themes:tags,matched:r.id,ev:1});
  out.innerHTML=head+answerHTML(r,"From what you sent me")+
    (rk.length>1?'<h2>Related</h2>'+qcards(rk.slice(1,4).map(function(x){return x.row}),3):'');
}

/* ---------- router ---------- */
function route(){var h=(location.hash||"").replace(/^#\/?/,"");
  if(!h)return{p:""};var s=h.split("/");
  if(s[0]==="call")return{call:s[1]};return{p:s[0]}}
function render(){
  var rt=route(),m=document.getElementById("main"),id="";
  if(rt.call){m.innerHTML=pageCall(rt.call)}
  else{
    id=rt.p;
    switch(id){
      case "":m.innerHTML=pageHome();wireSearch();break;
      case "ask":m.innerHTML=pageAsk();renderFlowSoon();break;
      case "read":m.innerHTML=pageRead();wireRead();break;
      case "answers":m.innerHTML=pageAnswers();break;
      case "search":m.innerHTML=pageSearch();wireSearch();break;
      case "map":m.innerHTML=pageMap();break;
      case "club":m.innerHTML=pageClub();break;
      case "writing":m.innerHTML=pageWriting();break;
      case "desk":m.innerHTML=pageDesk();animateCounters();break;
      default:m.innerHTML=pageHome();id="";
    }
  }
  var links=document.querySelectorAll("#mainnav a");
  for(var i=0;i<links.length;i++){
    if(links[i].getAttribute("data-p")===id) links[i].setAttribute("aria-current","page");
    else links[i].removeAttribute("aria-current");
  }
  document.getElementById("mainnav").classList.remove("open");
  window.scrollTo(0,0);
}
function renderFlowSoon(){renderFlow()}
function wireRead(){
  var d=document.getElementById("drop"),inp=document.getElementById("fileinput");
  if(!d)return;
  document.getElementById("pick").addEventListener("click",function(){inp.click()});
  inp.addEventListener("change",function(){addFiles(inp.files)});
  ["dragenter","dragover"].forEach(function(e){d.addEventListener(e,function(x){
    x.preventDefault();d.classList.add("over")})});
  ["dragleave","drop"].forEach(function(e){d.addEventListener(e,function(x){
    x.preventDefault();d.classList.remove("over")})});
  d.addEventListener("drop",function(x){if(x.dataTransfer&&x.dataTransfer.files)addFiles(x.dataTransfer.files)});
  document.getElementById("readit").addEventListener("click",runRead);
  paintFiles();
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-stage]");
  if(g){sv("pa_stage",g.getAttribute("data-stage"));
    if(route().p==="map"){render()}else{location.hash="#/map"}return}
  var t=e.target.closest("button, a");
  if(!t)return;
  if(t.tagName==="A"){
    var h=t.getAttribute("href")||"";
    if(h.indexOf("#/")===0 && h===(location.hash||"#/")){ e.preventDefault(); render(); return; }
    if(h==="#/" && (location.hash===""||location.hash==="#/")){ e.preventDefault(); render(); return; }
  }
  if(t.hasAttribute("data-opt")){
    var n=+t.getAttribute("data-opt");
    if(flow.i===0)flow.first=n;
    flow.picked[flow.i]=flow.qs[flow.i].opts[n].t||[];flow.i++;renderFlow();return}
  if(t.hasAttribute("data-back")){flow.i=Math.max(0,flow.i-1);renderFlow();return}
  if(t.hasAttribute("data-restart")){
    if(location.hash==="#/ask"){render()}else{location.hash="#/ask"}return}
  if(t.hasAttribute("data-depth")){
    setDepth(t.getAttribute("data-depth"));
    var q=document.getElementById("q");
    var keep=q?q.value:null;
    render();
    if(keep!==null){var q2=document.getElementById("q");if(q2){q2.value=keep;runSearch(keep)}}
    return}
  if(t.hasAttribute("data-hint")){
    var h=t.getAttribute("data-hint");
    var box=document.getElementById("q"); if(box){box.value=h}
    runSearch(h);return}
  if(t.hasAttribute("data-acc")){
    var id2=t.getAttribute("data-acc");
    sv("pa_open", ld("pa_open",null)===id2?null:id2);
    render();
    var el=document.querySelector('[data-acc="'+id2+'"]');
    if(el) el.scrollIntoView({block:"center",behavior:
      matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
    return}
  if(t.hasAttribute("data-send")){sendReply(t.getAttribute("data-send"));return}
  if(t.hasAttribute("data-signin")){
    if(CLOUD) CLOUD.signIn().catch(function(){toast("Sign-in cancelled.")});
    return}
  if(t.hasAttribute("data-open")){location.hash="#/call/"+t.getAttribute("data-open");return}
  if(t.hasAttribute("data-topic")){
    var tp=t.getAttribute("data-topic");
    sv("pa_topic",tp==="all"?null:tp);
    if(route().p==="answers"){render()}else{location.hash="#/answers"}return}
  if(t.hasAttribute("data-rm")){ev.files.splice(+t.getAttribute("data-rm"),1);paintFiles();return}
  if(t.hasAttribute("data-reset")){
    if(cloudOn()){toast("Connected to the cloud \u2014 delete rows in the Firebase console.");return}
    try{localStorage.removeItem("pa_req");localStorage.removeItem("pa_live")}catch(x){}
    render();return}
  if(t.hasAttribute("data-share")){
    var r=byId(t.getAttribute("data-share"));
    var url=location.origin+location.pathname+"#/call/"+r.id;
    var txt="Here\u2019s the bit that made me think of you \u2014 "+r.call+"\n\n"+url;
    try{
      if(navigator.share){navigator.share({title:"Pretty Ambitious",text:txt,url:url}).catch(function(){})}
      else if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){toast("Copied \u2014 send it on.")})
          .catch(function(){prompt("Copy this:",txt)})}
      else{prompt("Copy this:",txt)}
    }catch(x){prompt("Copy this:",txt)}
    return}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){
    var g=e.target.closest&&e.target.closest("[data-stage]");
    if(g){e.preventDefault();sv("pa_stage",g.getAttribute("data-stage"));
      if(route().p==="map"){render()}else{location.hash="#/map"}}}
});
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;
  document.body.appendChild(d);setTimeout(function(){d.remove()},2500)}

document.getElementById("mainnav").innerHTML=NAV.map(function(n){
  return '<a href="#/'+n.id+'" data-p="'+n.id+'">'+esc(n.label)+'</a>'}).join("");
document.getElementById("burger").addEventListener("click",function(){
  var n=document.getElementById("mainnav");n.classList.toggle("open");
  this.setAttribute("aria-expanded",n.classList.contains("open")?"true":"false")});

window.addEventListener("hashchange",render);
render();
</script>

        if (!requestId) return;
        await updateDoc(doc(db, "requests", requestId), {
          matched: answerId, repliedWith: answerId
        });

      watch(onRequests, onAnswers) {
        // answers are public - everyone sees them

          query(collection(db, "answers"), orderBy("at", "desc"), limit(300)),
          s => onAnswers(s.docs.map(d => Object.assign({ id: d.id }, d.data()))),
          () => {}
        );
        // requests are hers alone - this quietly fails for visitors, by design

          query(collection(db, "requests"), orderBy("at", "desc"), limit(300)),
          s => onRequests(s.docs.map(d => {
            const v = d.data();

            });
          })),
          () => {}
        );
      },
      signIn: () => signInWithPopup(auth, new GoogleAuthProvider()),
      onUser: cb => onAuthStateChanged(auth, cb)
    };

    if (window.PA_connect) window.PA_connect(api);
  } catch (err) {
    console.warn("Firebase did not load - staying local.", err);
  }
}
