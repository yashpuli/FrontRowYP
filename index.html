<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pretty Ambitious — ask me</title>
<meta name="description" content="Bring me your decision. I'll tell you what I'd do, what it costs, and what to do this week.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFDF8; --card:#FFFFFF; --ink:#17140F; --crimson:#C8102E; --indigo:#2B2A66;
  --marker:#FFE45E; --rule:#E6E0D2; --muted:#6E6759; --sunk:#F7F3E9; --mint:#1F6F5C;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Karla","Helvetica Neue",Arial,sans-serif;
  --pt:env(safe-area-inset-top,0px); --pb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--pt) + 76px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.55;padding-top:var(--pt);padding-bottom:var(--pb)}
a{color:var(--indigo)}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--crimson);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
img,svg{max-width:100%}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
#main>div{animation:rise .34s ease both}
.stagger>*{animation:rise .34s ease both}
.stagger>*:nth-child(2){animation-delay:.04s}
.stagger>*:nth-child(3){animation-delay:.08s}
.stagger>*:nth-child(4){animation-delay:.12s}
.stagger>*:nth-child(5){animation-delay:.16s}
.stagger>*:nth-child(6){animation-delay:.2s}
.stagger>*:nth-child(7){animation-delay:.24s}
.stagger>*:nth-child(8){animation-delay:.28s}
.bar i{transform-origin:left;animation:grow .55s cubic-bezier(.2,.7,.3,1) both}
.tile,.qcard,.soc,.pick{transition:transform .18s ease,border-color .18s ease,background .18s ease}
.tile:hover,.qcard:hover,.soc:hover,.pick:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){#main>div,.stagger>*,.bar i{animation:none}}

/* search */
.searchbox{border:1px solid var(--ink);background:var(--card);display:flex;align-items:flex-end;
  gap:10px;padding:12px 12px 12px 16px;max-width:740px}
.searchbox textarea{border:0;min-height:52px;padding:6px 0;font-size:17.5px;resize:none;
  background:transparent;flex:1}
.searchbox textarea:focus{outline:none}
.mic{background:none;border:1px solid var(--rule);width:44px;height:44px;cursor:pointer;
  display:grid;place-items:center;flex:0 0 auto}
.mic.live{border-color:var(--crimson);background:#FDECEE}
.mic.live svg{animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.gobtn{flex:0 0 auto;padding:12px 20px}
.hints{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.hint{border:1px solid var(--rule);border-radius:999px;background:var(--card);padding:7px 13px;
  font-size:14px;cursor:pointer;color:var(--muted)}
.hint:hover{border-color:var(--ink);color:var(--ink)}

/* depth toggle */
.depth{display:inline-flex;border:1px solid var(--rule);background:var(--card)}
.depth button{background:none;border:0;padding:8px 15px;cursor:pointer;font-size:14px;color:var(--muted)}
.depth button.on{background:var(--ink);color:var(--paper)}

/* answers page */
.group{margin-bottom:12px}
.ghead{display:flex;align-items:center;gap:13px;margin:38px 0 4px}
.ghead h2{margin:0}
.ghead .cnt{color:var(--muted);font-size:14px}
.acc{border-top:1px solid var(--rule)}
.accq{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);
  padding:20px 8px 20px 0;cursor:pointer;display:flex;gap:16px;align-items:flex-start}
.accq:hover{background:var(--sunk)}
.accq .qt2{font-family:var(--serif);font-size:22px;line-height:1.24;flex:1;margin:0}
.accq .plus{flex:0 0 auto;color:var(--crimson);font-size:22px;line-height:1;margin-top:2px}
.accbody{border-bottom:1px solid var(--rule);padding:4px 0 24px 42px;max-width:760px}
.accbody .oneline{font-family:var(--serif);font-size:21px;line-height:1.35;margin:0 0 16px}
.accbody .oneline mark{background:linear-gradient(180deg,transparent 58%,var(--marker) 58%,var(--marker) 94%,transparent 94%)}

/* picks */
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pick{border:1px solid var(--rule);background:var(--card);padding:18px 18px 16px;
  text-decoration:none;color:inherit;display:block}
.pick:hover{border-color:var(--ink)}
.pick b{font-family:var(--serif);font-weight:400;font-size:19px;display:block;line-height:1.25;margin:10px 0 4px}
.pick p{margin:0;color:var(--muted);font-size:14.5px}
.approved{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--crimson);
  color:var(--crimson);border-radius:999px;padding:3px 10px;font-size:11.5px;letter-spacing:.02em}

/* desk chat */
.thread{border:1px solid var(--rule);background:var(--card);margin-bottom:14px}
.thread .th{padding:14px 18px;border-bottom:1px solid var(--rule);display:flex;
  justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.thread .th p{margin:0 0 5px;font-family:var(--serif);font-size:19px;line-height:1.3}
.bubble{padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.bubble .who{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:15px}
.bubble.them .who{background:var(--sunk);border:1px solid var(--rule);color:var(--muted)}
.bubble.me .who{background:var(--crimson);color:#fff}
.bubble p{margin:0;font-size:15.5px}
.reply{border-top:1px solid var(--rule);padding:12px 18px;display:flex;gap:10px;align-items:flex-end}
.reply textarea{min-height:56px;font-size:15.5px;flex:1}
.counter{display:inline-block}
.emptyslot{border:1px dashed var(--rule);padding:18px;color:var(--muted);font-size:15px;background:var(--card)}

@media (max-width:1040px){ .picks{grid-template-columns:repeat(2,1fr)} }
@media (max-width:780px){
  .picks{grid-template-columns:1fr}
  .searchbox{flex-wrap:wrap}
  .searchbox textarea{flex:1 1 100%}
  .gobtn{flex:1}
  .accbody{padding-left:0}
}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(255,253,248,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);
  padding-top:var(--pt);margin-top:calc(-1 * var(--pt))}
.navrow{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:12px 26px}
.logo{font-family:var(--serif);font-size:25px;line-height:1;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo em{font-style:italic;color:var(--crimson)}
.mainnav{display:flex;gap:20px;flex:1;flex-wrap:wrap}
.mainnav a{text-decoration:none;color:var(--ink);font-size:15.5px;padding:4px 0;border-bottom:2px solid transparent}
.mainnav a:hover{border-bottom-color:var(--rule)}
.mainnav a[aria-current="page"]{border-bottom-color:var(--crimson);color:var(--crimson)}
.barcta{background:var(--ink);color:var(--paper);border:0;padding:9px 16px;cursor:pointer;
  font-weight:600;font-size:14.5px;text-decoration:none;white-space:nowrap}
.barcta:hover{background:var(--crimson)}
.burger{display:none;background:none;border:1px solid var(--rule);padding:6px 10px;cursor:pointer}

/* ---------- layout ---------- */
.wrap{max-width:1320px;margin:0 auto;padding:34px 26px 100px}
.narrow{max-width:760px}
.eyebrow{font-size:13px;color:var(--crimson);margin:0 0 7px;letter-spacing:.01em}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(34px,4.6vw,58px);line-height:1.02;
  margin:0 0 16px;letter-spacing:-.015em}
h1 em{font-style:italic}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(24px,2.6vw,32px);line-height:1.12;margin:44px 0 6px}
h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 5px}
.lede{font-size:18.5px;color:var(--muted);max-width:60ch;margin:0 0 26px}
.sub{color:var(--muted);font-size:15px;margin:0 0 22px}
.hr{height:1px;background:var(--rule);border:0;margin:40px 0}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;
  padding:16px 0 10px}
.hero-say{border-left:3px solid var(--marker);padding-left:16px;font-family:var(--serif);
  font-size:21px;font-style:italic;line-height:1.35;color:var(--muted);margin:22px 0 0;max-width:46ch}
.heroart{display:block}

/* ---------- buttons ---------- */
.btn{background:var(--indigo);color:#fff;border:0;padding:13px 24px;cursor:pointer;font-weight:600;
  text-decoration:none;display:inline-block}
.btn:hover{background:var(--crimson)}
.btn-ghost{background:none;border:1px solid var(--rule);color:var(--ink);padding:13px 22px;
  cursor:pointer;text-decoration:none;display:inline-block}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:7px 13px;font-size:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---------- topic tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:10px}
.tile{background:var(--card);border:0;padding:22px 20px 20px;cursor:pointer;text-align:left;display:block}
.tile:hover{background:var(--sunk)}
.tile svg{display:block;margin-bottom:12px}
.tile b{font-family:var(--serif);font-weight:400;font-size:20px;display:block;line-height:1.2}
.tile span{color:var(--muted);font-size:14.5px;display:block;margin-top:4px}
.tile i{font-style:normal;color:var(--crimson);font-size:12.5px;display:block;margin-top:10px}

/* ---------- cards ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.qcard{border:1px solid var(--rule);background:var(--card);padding:20px;cursor:pointer;
  text-align:left;display:block;width:100%}
.qcard:hover{border-color:var(--ink)}
.qcard b{font-family:var(--serif);font-weight:400;font-size:19.5px;display:block;line-height:1.26}
.qcard p{margin:9px 0 0;color:var(--muted);font-size:15px}
.qcard .tagline{margin-top:12px}

/* ---------- answer ---------- */
.answer{border:1px solid var(--ink);background:var(--card);max-width:780px}
.ahead{display:flex;gap:12px;align-items:center;padding:15px 22px;border-bottom:1px solid var(--rule)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--crimson);color:#fff;
  display:grid;place-items:center;font-family:var(--serif);font-size:18px;flex:0 0 auto}
.ahead .nm{font-size:14px}
.ahead .nm b{display:block;font-weight:600}
.ahead .nm span{color:var(--muted);font-size:13px}
.abody{padding:24px 22px}
.asked{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);margin:0 0 16px;line-height:1.3}
.call{font-family:var(--serif);font-size:clamp(23px,2.5vw,30px);line-height:1.28;margin:0}
.call mark{background:linear-gradient(180deg,transparent 58%,var(--marker) 58%,var(--marker) 94%,transparent 94%);
  color:inherit;padding:0 2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.fact{border:1px solid var(--rule);padding:14px 15px;background:var(--sunk)}
.fact .ft{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--crimson);margin-bottom:5px}
.fact p{margin:0;font-size:15.5px;line-height:1.45}
.doit{border:1px solid var(--ink);padding:16px 18px;margin-top:14px;background:var(--card)}
.doit .ft{display:flex;gap:8px;align-items:center;font-size:13px;margin-bottom:5px}
.doit p{margin:0}
details.more{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
details.more summary{cursor:pointer;color:var(--indigo);font-size:15px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ ";color:var(--crimson)}
details.more[open] summary::before{content:"\2212 "}
details.more .inner{padding-top:10px;color:var(--muted);font-size:15px}
.afoot{border-top:1px solid var(--rule);padding:14px 22px;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- misc ---------- */
.tagline{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.chip.on{border-color:var(--crimson);color:var(--crimson)}
.filter{border:1px solid var(--rule);border-radius:999px;padding:6px 13px;font-size:13.5px;
  cursor:pointer;background:none}
.filter.on{border-color:var(--crimson);color:var(--crimson);background:var(--card)}
.miss{border:1px dashed var(--crimson);padding:26px;max-width:700px;background:var(--card)}
.miss h3{color:var(--crimson)}
.note{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--marker);
  padding:14px 17px;max-width:720px;font-size:15px;margin:20px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + var(--pb));
  background:var(--ink);color:var(--paper);padding:11px 18px;font-size:14px;z-index:70}

/* ---------- question flow ---------- */
.qwrap{border:1px solid var(--rule);background:var(--card);padding:28px 26px;max-width:640px}
.prog{height:3px;background:var(--rule);margin-bottom:18px}
.prog i{display:block;height:3px;background:var(--crimson);transition:width .25s}
.qn{font-size:13px;color:var(--muted);margin-bottom:9px}
.qt{font-family:var(--serif);font-size:28px;line-height:1.16;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;background:var(--paper);border:1px solid var(--rule);padding:13px 15px;
  cursor:pointer;line-height:1.35}
.opt:hover{border-color:var(--ink);background:var(--card)}

/* ---------- career map ---------- */
.mapwrap{border:1px solid var(--rule);background:var(--card);padding:26px 20px;overflow-x:auto}
.stagebtn{cursor:pointer}
.stagebtn:hover circle{fill:var(--marker)}

/* ---------- club ---------- */
.club{display:grid;grid-template-columns:1.1fr .9fr;gap:0;border:1px solid var(--ink);background:var(--card)}
.clubtext{padding:30px 28px}
.clubart{background:var(--sunk);display:grid;place-items:center;padding:18px;border-left:1px solid var(--rule)}
.evt{border:1px solid var(--rule);background:var(--card);padding:18px 20px;margin-bottom:12px}
.evt .when{font-size:13px;color:var(--crimson)}
.evt b{font-family:var(--serif);font-weight:400;font-size:21px;display:block;margin:2px 0 5px}
.evt p{margin:0 0 12px;color:var(--muted);font-size:15px}

/* ---------- writing ---------- */
.post{border-top:1px solid var(--rule);padding:16px 0;display:block;text-decoration:none;color:inherit}
.post:hover b{color:var(--crimson)}
.post b{font-family:var(--serif);font-weight:400;font-size:20px;display:block}
.post span{color:var(--muted);font-size:14.5px}
.social{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.soc{border:1px solid var(--rule);background:var(--card);padding:18px 20px;text-decoration:none;
  color:inherit;display:block}
.soc:hover{border-color:var(--ink)}
.soc b{font-family:var(--serif);font-weight:400;font-size:20px;display:block;margin:10px 0 3px}
.soc span{color:var(--muted);font-size:14.5px}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule)}
.kpi{background:var(--card);padding:18px 16px}
.kpi b{font-family:var(--serif);font-size:34px;font-weight:400;display:block;line-height:1}
.kpi span{font-size:13px;color:var(--muted)}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.panel{border:1px solid var(--rule);background:var(--card);padding:20px}
.panel h3{margin-bottom:12px}
.bar{display:grid;grid-template-columns:120px 1fr 30px;gap:10px;align-items:center;
  margin-bottom:7px;font-size:14px}
.bar .lab{text-align:right;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{min-width:0;background:var(--sunk)}
.bar i{display:block;height:14px;background:var(--crimson);max-width:100%}
.bar .n{color:var(--muted);font-size:13px}
.qrow{border-bottom:1px solid var(--rule);padding:13px 0;display:flex;gap:12px;
  justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.qrow .m{flex:1;min-width:220px}
.qrow .m p{margin:0 0 5px;font-family:var(--serif);font-size:18px;line-height:1.3}
.pill{font-size:12px;padding:3px 9px;border:1px solid var(--rule);white-space:nowrap}
.pill.done{border-color:var(--mint);color:var(--mint)}
.pill.needs{border-color:var(--crimson);color:var(--crimson)}
.plan{border:1px solid var(--rule);background:var(--card);padding:20px;margin-bottom:14px}
.plan h3{margin-bottom:3px}
.plan .why{color:var(--muted);font-size:14.5px;margin:0 0 12px}
.plan ol{margin:0;padding-left:20px}
.plan li{margin-bottom:7px;font-size:15.5px}
.plan .fmt{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}

/* ---------- upload ---------- */
.drop{border:2px dashed var(--rule);background:var(--card);padding:34px 22px;text-align:center}
.drop.over{border-color:var(--crimson);background:var(--sunk)}
textarea{width:100%;min-height:170px;padding:15px;font-family:var(--sans);font-size:16px;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);line-height:1.5}
.fileitem{display:flex;justify-content:space-between;gap:12px;align-items:center;
  border-bottom:1px solid var(--rule);padding:9px 0;font-size:15px}
.fileitem span{color:var(--muted);font-size:13px}

@media (max-width:1040px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:repeat(2,1fr)}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .panels{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;gap:26px}
  .club{grid-template-columns:1fr}
  .clubart{border-left:0;border-top:1px solid var(--rule)}
}
@media (max-width:780px){
  .bar{grid-template-columns:96px 1fr 26px;gap:8px}
  .mainnav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--paper);
    border-bottom:1px solid var(--rule);flex-direction:column;gap:0;padding:6px 26px 14px}
  .mainnav.open{display:flex}
  .mainnav a{padding:10px 0;border-bottom:1px solid var(--rule)}
  .burger{display:block;padding:6px 9px;font-size:13.5px}
  .navrow{gap:10px;padding:10px 16px}
  .logo{font-size:20px;flex:1 1 auto;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .barcta{padding:8px 12px;font-size:13.5px}
  .wrap{padding:24px 18px 90px}
  .grid3,.grid2,.social,.facts{grid-template-columns:1fr}
  .tiles{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .qwrap{padding:22px 18px}
  .abody{padding:20px 18px}
}
</style>
</head>
<body>

<header>
  <div class="navrow">
    <a class="logo" href="#/" >Pretty <em>Ambitious</em></a>
    <button class="burger" id="burger" aria-label="Menu" aria-expanded="false">Menu</button>
    <nav class="mainnav" id="mainnav"></nav>
    <a class="barcta" href="#/ask">Ask me</a>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<script>
var DATA = {"corpus": [{"id": "C-01", "q": "Would you take the seed-stage offer or stay where I am?", "call": "Take it, but not for the equity - take it because you will learn in nine months what your current job will teach you in four years.", "how": "The answer she gave a founder backstage, and the six founder stage interviews in the can.", "cost": "A pay cut you will feel for about eighteen months, and roughly two years before the equity means anything at all. The real cost is the safety of being good at something - you will be bad at your job again for a while.", "unless": "If you cannot cover three months of rent without this salary, stay. Optionality you cannot afford is not optionality, it is a gamble with a story attached.", "do": "By Sunday, write down the one thing you would learn there that you cannot learn where you are. If you cannot fill the line in one sentence, the offer is not the reason you want to leave.", "again": "yes", "note": "Dear reader who has had the offer email open in a tab for nine days.", "src": "E-01.2, E-03.4, E-04.1", "tags": ["job-offer", "stay-or-go", "deciding-now", "tech", "pre-decision"]}, {"id": "C-02", "q": "How do I actually get into that room?", "call": "Stop trying to get into the room and make one thing the room has to react to - the invitations follow the artefact, never the other way round.", "how": "Cannes Lions week, and the keynote to 300 people.", "cost": "Three to six months of making things nobody asks for, in public. Money: almost none. What you give up is the comfort of being promising rather than judged.", "unless": "If you already have something people point at and you still cannot get in, then it is a network problem, not an output problem - and the fix is ten specific asks, not more work.", "do": "This week, publish one thing with your name on it and send it to three people who were in a room you want to be in. Not asking for anything. Just the thing.", "again": "yes", "note": "Dear reader who has watched the same clip six times and still not sent the email.", "src": "E-01.1, E-05.2, E-07.1, E-04.2", "tags": ["visibility", "no-network", "pre-decision", "start-something", "tech", "london"]}, {"id": "C-03", "q": "I have about GBP 600. Is the week actually worth it?", "call": "Worth it only if you go with three names and a reason each - otherwise you are buying a very expensive feeling of having been nearby.", "how": "The post about what that week actually cost her - 890K views, 611 sign-ups, her second-highest converting piece.", "cost": "GBP 600 and four days, plus the two weekends afterwards you will spend following up. If you do not block those weekends now, you have spent the 600 on nothing.", "unless": "If you are going to meet people you could email instead, save the money. Proximity is only worth paying for when the conversation cannot happen any other way.", "do": "Before you book, write the three names and one sentence on why each should care about you. If you cannot fill all three sentences by Friday, do not go.", "again": "not like that", "note": "Dear reader who has opened the booking page three times this week.", "src": "E-01.4, E-03.3, E-07.3", "tags": ["spend-money", "500-2k", "pre-decision", "deciding-now", "visibility", "london"]}, {"id": "C-04", "q": "How do I build in public without annoying my employer?", "call": "Post about the decision, never the deal - your judgement is yours to share, your employer's information is not.", "how": "The three questions she asks before posting anything - 1.4M views, 340 sign-ups.", "cost": "Roughly two hours a week and a low background hum of self-consciousness. What you give up is the best material, because the best material is usually the confidential material.", "unless": "If your contract or your manager has said no explicitly, stop. Building in public is not worth a disciplinary, and the version of this that works is one conversation with your manager, not a clever workaround.", "do": "This week, write your own three-line rule for what you will never post. Show it to your manager. Their agreement is the thing that makes the next hundred posts easy.", "again": "yes", "note": "Dear reader who drafts posts and deletes them before anyone sees.", "src": "E-01.9, E-03.1, E-05.1", "tags": ["visibility", "employer-risk", "deciding-now", "tech", "start-something"]}, {"id": "C-05", "q": "I took the job. What do I actually do in the first 30 days?", "call": "Spend the first thirty days finding out what the person who hired you is quietly afraid of, and fix one small piece of it.", "how": "The six founder stage interviews - the same answer came back from nearly all of them.", "cost": "About four weeks of holding your tongue while you understand the place. What you give up is the urge to prove yourself in week one, which is the thing most people cannot give up.", "unless": "If you were hired into a crisis with an explicit mandate, invert this - act in week one, and learn while you are acting. Listening tours are for stable companies.", "do": "In your first week, ask your manager: what is the thing you are hoping I quietly take off your plate? Write the answer down. That is your first 30 days.", "again": "yes", "note": "Dear reader who starts on Monday and has already rewritten the intro message four times.", "src": "E-01.8, E-04.1", "tags": ["post-decision", "first-90-days", "already-committed", "tech", "job-offer"]}, {"id": "C-06", "q": "I am not in London. How would you do this from where I am?", "call": "Do not move for the room - build the thing where you are until someone in the room has a reason to fly you in.", "how": "The six-country speaking run, four months, and the reader replies that come in from outside the UK.", "cost": "Slower. Expect the first eighteen months to feel like shouting into a well. Money: less than moving, by an order of magnitude. What you give up is the illusion that geography was the obstacle.", "unless": "If your work genuinely requires being physically present - the job is in a building, the customers are in one city - then move, and move properly rather than visiting.", "do": "This week, find the three people doing your version of this in your city. Not the London ones. Message all three. A local room you can walk to beats a global one you cannot.", "again": "yes", "note": "Dear reader who keeps reading advice written for a city you do not live in.", "src": "E-01.3, E-04.7, E-04.8", "tags": ["relocate", "outside-uk", "india", "no-network", "pre-decision"]}, {"id": "C-07", "q": "Can you do a version of this for someone outside tech?", "call": "The framing transfers completely - only the vocabulary changes, and the vocabulary was never the point.", "how": "The keynote to 300 in the room, and the newsletter archive of 42,000 readers who are not all in tech.", "cost": "Nothing, except the effort of translating it yourself. What you give up is the excuse that this advice was for other people.", "unless": "If the advice depends on a specific mechanic - fundraising, equity, a tech hiring market - then it does not transfer, and you should ignore it rather than force it.", "do": "This week, take the last piece of advice you liked and rewrite it in the language of your own industry. If it survives translation, it was real advice.", "again": "yes", "note": "Dear reader who likes the thinking but keeps getting told it is not for your industry.", "src": "E-01.7, E-04.3, E-04.6", "tags": ["non-tech", "pre-decision", "start-something", "visibility", "deciding-now"]}, {"id": "C-08", "q": "What would you have asked them?", "call": "Ask the question you would be slightly embarrassed to ask in front of your peers - it is nearly always the only one worth the room's time.", "how": "The six founder stage interviews, and the backstage Q&A that was never recorded.", "cost": "About thirty seconds of feeling stupid. What you give up is looking clever, which is what the other twenty questions in the room are buying.", "unless": "If the room is genuinely hostile or the person is fragile, do not - some rooms are not safe places to be direct, and reading that correctly is also judgement.", "do": "Before your next meeting, write the one question you are slightly afraid to ask. Ask it in the first ten minutes, while you still have the nerve.", "again": "yes", "note": "Dear reader who thinks of the right question in the taxi home.", "src": "E-05.2, E-03.4, E-04.5", "tags": ["deciding-now", "tech", "pre-decision", "visibility"]}, {"id": "C-09", "q": "Should I go to the big conference this year?", "call": "Go once, and go to the dinners rather than the stages - the stage content will be on YouTube in a fortnight and the dinners will not.", "how": "Cannes Lions week - 40 clips, half of them still uncut, and the post about it did 3.9M views and 62 sign-ups.", "cost": "Several thousand pounds and a week you do not get back. What you give up is a week of making your own things while you watch other people talk about theirs.", "unless": "If you are going because it is the done thing and you cannot name a single person you need to see there, the money is better spent on almost anything else.", "do": "By Friday, list who you want at the dinner. If your list is shorter than four, do not buy the ticket - organise the dinner instead, in your own city, for a tenth of the price.", "again": "not like that", "note": "Dear reader who keeps seeing everyone else's photos from the same week.", "src": "E-03.2, E-04.2", "tags": ["spend-money", "over-2k", "pre-decision", "visibility", "deciding-now"]}, {"id": "C-10", "q": "Should I take the brand deal?", "call": "Take it only if you would have mentioned them for free - the moment the answer is no, the audience can tell, and you have sold something you cannot buy back.", "how": "The post about the opportunities she said no to this year - 1.1M views, no direct sign-ups, and the highest trust of anything she has published.", "cost": "Usually more editing than the fee justifies. What you give up is the ability to say the same thing next month and be believed.", "unless": "Early on, with no audience to lose, take the money and learn how the deals work. This rule is for people with something to protect.", "do": "This week, write the list of things you would never take money to say. Keep it somewhere you will see it when the email arrives.", "again": "no", "note": "Dear reader with an offer in the inbox and a bad feeling you cannot justify.", "src": "E-03.5, E-05.1", "tags": ["spend-money", "deciding-now", "creator", "visibility", "already-committed"]}, {"id": "C-11", "q": "Should I do the unpaid speaking gig?", "call": "Do the first three unpaid, then stop - after the third, you have the tape, and the tape is what gets you paid.", "how": "The six-country speaking run, four months, and the keynote to 300 that has been used exactly once.", "cost": "A day of prep, a day of travel, and the quiet cost that unpaid work tends to attract more unpaid work.", "unless": "If the room has nobody in it who can hire you or hire someone like you, and you already have footage, it is not exposure - it is a favour, and you should price it as one.", "do": "Say yes, then ask for one thing that costs them nothing: a recording, or the attendee list. Ask before you accept, this week, while you still have leverage.", "again": "not like that", "note": "Dear reader who has said yes to three of these and is starting to resent it.", "src": "E-03.5, E-04.3, E-04.7", "tags": ["unpaid", "deciding-now", "visibility", "pre-decision", "no-budget"]}, {"id": "C-12", "q": "Should I post this or keep it to myself?", "call": "If you would not say it to your sister on the phone, do not post it - that filter has never once been wrong.", "how": "The three questions she asks before posting anything - 1.4M views, 68K saves, 340 sign-ups.", "cost": "About ten minutes of thinking before you press publish. What you give up is roughly a third of your ideas, which is the correct third.", "unless": "If the only reason you are hesitating is that it is unflattering to you rather than to someone else, post it - that discomfort is usually the signal it is worth reading.", "do": "Before your next post, run it past the phone test out loud. If you hear yourself hedging, the post is not ready.", "again": "yes", "note": "Dear reader with a draft you have rewritten four times and still not published.", "src": "E-03.1, E-05.1", "tags": ["visibility", "employer-risk", "deciding-now", "creator"]}, {"id": "C-13", "q": "I keep opening this and not deciding. What is wrong with me?", "call": "Nothing is wrong with you - you are missing one fact, and until you name it you will keep reopening the tab instead of deciding.", "how": "The 2,600 reader replies a month, which she calls the actual research.", "cost": "Fifteen minutes and a pen. What you give up is the comfort of calling indecision 'thinking about it'.", "unless": "If you have named the missing fact and still cannot decide, the honest answer is that you do not want it. That is allowed, and it is faster than another month of this.", "do": "Today, write the single fact that would settle this. Then write who has it. Then ask them, this week. Most decisions are a missing fact wearing a costume.", "again": "yes", "note": "Dear reader who has opened this three times and is still deciding.", "src": "E-01.12, E-04.8", "tags": ["deciding-now", "pre-decision", "stay-or-go", "no-budget", "drifting"]}, {"id": "C-14", "q": "Someone sent me this because they think I need it. Do I?", "call": "The person who forwarded it knows something about your situation that you have not said out loud yet - start there, not with the content.", "how": "The walk-home voice notes, nine hours of them, where most of this thinking actually happens.", "cost": "One uncomfortable conversation. What you give up is the version of yourself who has not been told this.", "unless": "If they forward you everything, ignore it - this only means something when it is the first thing they have ever sent you.", "do": "This week, ask them directly: what made you send me this? The answer is usually more useful than whatever they sent.", "again": "yes", "note": "Dear reader whose manager sent you a clip and you are not sure how to feel about it.", "src": "E-01.11, E-04.4", "tags": ["pre-decision", "deciding-now", "tech", "stay-or-go"]}, {"id": "C-15", "q": "Should I start the newsletter?", "call": "Start it, and commit to twenty issues before you let yourself judge it - almost everyone quits at issue six, which is exactly where it stops being embarrassing.", "how": "The newsletter archive - 42,000 people, and her own note that she lost the thread.", "cost": "Two to four hours a week, every week. What you give up is the ability to have opinions privately.", "unless": "If you have nothing you keep answering in DMs, wait. A newsletter is a faster way to answer a question people are already asking you, not a way to find one.", "do": "This week, write down the question you have answered more than three times this month. That is issue one. Send it by Sunday, to twenty people.", "again": "yes", "note": "Dear reader with a Substack account created eight months ago and nothing in it.", "src": "E-04.6, E-05.2, E-05.3", "tags": ["start-something", "creator", "pre-decision", "no-budget", "visibility"]}, {"id": "C-16", "q": "Should I try to reply to everyone?", "call": "Answer the question once, properly, in public - answering the same thing 2,600 times privately feels like generosity and is actually a way of hiding.", "how": "Two DM sprints a day, 44 useful questions answered, and a queue that still ends the day above 130.", "cost": "The public answer takes four times as long to write. What you give up is the intimacy of the private reply, which is a real loss and worth naming.", "unless": "Early on, reply to everyone - it is how you find out what people actually want. This rule only applies once the same question arrives for the tenth time.", "do": "This week, take the question you answered most often and write it once, properly. Then reply to the next ten askers with that link and one personal line.", "again": "not like that", "note": "Dear reader whose inbox is a to-do list written by other people.", "src": "E-02, E-04.8, E-05.7", "tags": ["creator", "deciding-now", "visibility", "already-committed", "burnout"]}, {"id": "C-17", "q": "Do I need a personal brand to get anywhere?", "call": "You do not need a brand, you need one thing you are known for being right about - the brand is what other people call it afterwards.", "how": "The keynote to 300 in the room, which she says should have been ten things rather than one talk.", "cost": "About a year of saying the same thing while it feels repetitive to you and new to everyone else. What you give up is range, temporarily.", "unless": "If your work already speaks for itself in a small market - you are hired by reputation and the pipeline is full - this is a distraction. Do the work instead.", "do": "This week, write the one sentence you want people to repeat about you when you are not in the room. Then check whether your last ten posts would produce it.", "again": "yes", "note": "Dear reader who has been told to build a personal brand and finds the phrase embarrassing.", "src": "E-04.3, E-05.5", "tags": ["visibility", "pre-decision", "tech", "non-tech", "start-something"]}, {"id": "C-18", "q": "Should I say yes to the travel? It is a lot of countries in a short time.", "call": "Say yes to half of it - the half where you would have gone anyway - and give the other half to someone who has never been asked.", "how": "The six-country speaking run, four months, and her own note that there is only one of her.", "cost": "Four months of your life and every evening in it. What you give up is the thing you were going to make while you were on the plane.", "unless": "If this is the run that establishes you and it will not come round again, take all of it, and accept rking done from an empty tank produces nothing and costs you the weekend.", "do": "Before you go, message the organiser this week and offer to help with something. A role beats a ticket every time.", "again": "yes", "note": "Dear reader who has bought the ticket and is now hoping something comes up.", "src": "E-04.2, E-07.1", "tags": ["visibility", "no-network", "spend-money", "under-500", "pre-decision"]}, {"id": "C-21", "q": "Expensive ticket or the cheap one?", "call": "Cheap ticket, and spend the difference on getting there early and staying an extra night - the value is in the margins of the event, never the middle of it.", "how": "The post about what that week actually cost her, and 40 clips from Cannes of which half are still uncut.", "cost": "The difference is usually a few hundred pounds and a better lanyard. What you give up is access to sessions that will be online within the fortnight anyway.", "unless": "If the expensive tier is the only one with the dinner or the small-room session, buy it - you are buying the room size, not the badge.", "do": "Before booking, check exactly what the top tier includes that the cheap one does not. If the answer is seating and a tote bag, you have your answer.", "again": "yes", "note": "Dear reader with two tabs open and a spreadsheet you have not filled in.", "src": "E-03.3, E-04.2, E-07.3", "tags": ["spend-money", "500-2k", "deciding-now", "pre-decision", "no-budget"]}, {"id": "C-22", "q": "Should I ask them for the introduction?", "call": "Ask, but write the introduction for them - a forwardable paragraph they can send without editing is the difference between yes and eventually.", "how": "The backstage Q&A she calls the best answer she ever gave, which nobody recorded.", "cost": "Ten minutes of writing and a small amount of nerve. What you give up is the ability to tell yourself you never got the chance.", "unless": "If you have not given them anything and this is your first contact, do not ask yet - one useful thing first, then the ask, and the gap between them should be weeks not hours.", "do": "This week, write the three-line intro in the third person and send it with: feel free to send this on, or ignore it entirely, no awkwardness either way.", "again": "yes", "note": "Dear reader who has drafted the message and not sent it.", "src": "E-04.5, E-05.2", "tags": ["no-network", "visibility", "deciding-now", "pre-decision"]}, {"id": "C-23", "q": "Should I take the title or the money?", "call": "Take the money - titles reset the moment you change company, and the money compounds from the day it lands.", "how": "The six founder stage interviews, and the walk-home voice notes where she keeps returning to this one.", "cost": "Usually a slightly less impressive line on LinkedIn for two years. What you give up is the version of you that other people are impressed by at parties.", "unless": "If the title unlocks a specific room you cannot otherwise enter - a board seat, a speaking circuit, a regulated qualification - take the title and negotiate the money next cycle.", "do": "Before you reply, ask for both. This week. The worst outcome of asking is the offer you already have.", "again": "yes", "note": "Dear reader comparing two offers and pretending the title does not matter to you.", "src": "E-04.1, E-04.4", "tags": ["job-offer", "negotiate", "deciding-now", "pay-cut", "tech"]}, {"id": "C-24", "q": "Should I quit and do this full time?", "call": "Not yet - go part time or go on the side until the thing has paid you twice from two different people, and then go properly.", "how": "Her own notes on what she keeps and kills, and the newsletter archive she describes as dormant because she lost the thread.", "cost": "Six to twelve months of doing two jobs badly at the same time. What you give up is sleep and most of your weekends, and you should know that before rather than after.", "unless": "If you have runway, no dependents and a clear twelve-month window, jumping is the faster route and the part-time version will quietly kill it. Be honest about which of those three you actually have.", "do": "This week, write the number you need to earn monthly for this to be viable, and the date by which you need to hit it. Put the date in your calendar. Vague plans do not survive month four.", "again": "not like that", "note": "Dear reader who has been thinking about making the move for two years.", "src": "E-05.1, E-05.3, E-04.6", "tags": ["stay-or-go", "start-something", "creator", "deciding-now", "pre-decision", "burnout", "drifting"]}, {"id": "S-01", "q": "Everyone my age is ahead of me. Should I change what I am doing?", "call": "Do not change the plan, change the data you are reading - the mean age of a successful founder is 45, not 25, and you have been racing a timeline that does not exist.", "how": "you were never behind, April 2026 - the Kauffman/MIT study on 2.7 million founders.", "cost": "Fifteen minutes and a pen. What you give up is the story that you are behind, which you have been using as fuel and which has been costing you more than it produces.", "unless": "If you have genuinely been drifting for three years with no answer to what you are optimising for, reassurance is the wrong medicine. You need the audit, not the permission.", "do": "This week, write the three people whose careers make you feel behind, and next to each, whether you have actually spoken to them in the last year. Then write what you are optimising for in five years, in one sentence.", "again": "yes", "note": "Dear reader who closed LinkedIn, opened it again, and closed it again.", "src": "SUBSTACK: you were never behind, 14 Apr 2026 - see also her comment reply, same post, for the 'different fuel' framing", "tags": ["comparison", "am-i-behind", "stay-or-go", "deciding-now", "mid-career"]}, {"id": "S-02", "q": "I want to start posting but I am doing it out of fear, not confidence. Is that a bad reason?", "call": "Fear is a perfectly valid reason to build something - start anyway, and stop performing ambition you do not feel, because the honesty is the part that works.", "how": "nobody started a personal brand because they were happy, May 2026.", "cost": "Two to four hours a week, indefinitely. What you give up is the comfortable story that you are doing this because you are ambitious rather than because you are scared.", "unless": "If the fear is about one specific thing you could fix directly - a savings gap, a visa, a manager - fix that first. A personal brand is a slow hedge, not an emergency exit.", "do": "This week, write the actual reason you want to start, the unflattering version, and keep it somewhere private. You do not have to publish it. You do have to stop lying to yourself about it.", "again": "yes", "note": "Dear reader who has had the ring light in the box for three weeks.", "src": "SUBSTACK: nobody started a personal brand because they were happy, 31 May 2026", "tags": ["personal-brand", "start-something", "visibility", "pre-decision", "imposter"]}, {"id": "S-03", "q": "Should I build something on the side as insurance against being laid off?", "call": "Yes, and be honest that it is a hedge rather than a calling - build something that cannot fire you, and stop calling it passion when it is insurance.", "how": "nobody started a personal brand because they were happy, May 2026 - written after a round of layoffs at her previous company.", "cost": "Evenings and weekends, for a long time. What you give up is the separation between work and rest, and nobody tells you that the side thing has no healthcare and nobody to have lunch with.", "unless": "If you are already close to burnout, adding a second unregulated job is not insurance, it is acceleration. Fix the sleep first, then build.", "do": "This week, write the number of months you could survive if the calendar invite came tomorrow. That number, not the follower count, is what the side thing is for.", "again": "yes", "note": "Dear reader whose friend found out she was laid off because her Slack went grey.", "src": "SUBSTACK: nobody started a personal brand because they were happy, 31 May 2026", "tags": ["side-income", "layoff-risk", "start-something", "deciding-now", "employer-risk", "burnout"]}, {"id": "S-04", "q": "How many followers do I need before this counts as real?", "call": "There is no number - the goalpost moves every time you reach it, so pick a thing to be right about instead of a number to reach.", "how": "How Much Is Enough, April 2026 - the conversation with her sister and her father about what counts as a real creator.", "cost": "Nothing, except giving up the target you have been using to postpone feeling alright about your own work.", "unless": "If you have a concrete commercial goal that genuinely requires scale - a rate card, a sponsor threshold - then the number is real and you should name it precisely rather than vaguely.", "do": "This week, replace your follower goal with one sentence describing what you want to be known for being right about. Check whether your last ten posts would produce it.", "again": "yes", "note": "Dear reader who has moved the goalpost three times this year and not noticed.", "src": "SUBSTACK: How Much Is Enough, 5 Apr 2026", "tags": ["personal-brand", "comparison", "creator", "deciding-now", "imposter"]}, {"id": "S-05", "q": "I send money home every month. How do I factor that into a career decision?", "call": "Put it in the spreadsheet as a fixed cost, not a moral question - the reason these decisions feel impossible is that you have been carrying a number you never wrote down.", "how": "nobody started a personal brand because they were happy, May 2026 - the section on readers sending money home, and what no cost-of-living analysis includes.", "cost": "Nothing to write it down. Everything to keep pretending it is not there. What you give up is the version of the decision where this is invisible.", "unless": "If naming the number would create a conversation at home you are not ready for, write it privately first. The spreadsheet is for you, not for them.", "do": "This week, write the monthly figure down and put it in the same place as your rent. Any offer that does not clear it is not an offer, whatever the headline salary says.", "again": "yes", "note": "Dear reader who has never been able to explain this to a colleague without it sounding like a sob story.", "src": "SUBSTACK: nobody started a personal brand because they were happy, 31 May 2026", "tags": ["salary", "pay-cut", "outside-uk", "india", "deciding-now"]}, {"id": "S-06", "q": "There are twenty-seven jobs on this list. Which ones are actually for me?", "call": "Apply to three, not twenty-seven - pick the ones where you can name why you specifically, and write that sentence before you write the application.", "how": "The jobs section, run in every issue - 15 companies in April, 27 across Europe and India by late May.", "cost": "Roughly two hours per real application. What you give up is the comfort of volume, which feels like effort and produces almost nothing.", "unless": "If you are being made redundant with a deadline, invert this - apply widely and fast, and be selective later when you have leverage again.", "do": "By Friday, pick three from the list and write one sentence each on why you specifically. If you cannot fill the sentence, that one is not on your list.", "again": "yes", "note": "Dear reader who has saved four job lists and applied to none of them.", "src": "SUBSTACK: jobs section, recurring - 14 Apr 2026 and 26 May 2026", "tags": ["job-offer", "career-change", "deciding-now", "remote", "pre-decision"]}, {"id": "S-07", "q": "My job title is basically my identity. What happens to me if I lose it?", "call": "Build one thing with your name on it rather than your employer's, starting now, because the scaffolding you are standing on belongs to someone else's Q3 budget.", "how": "nobody started a personal brand because they were happy, May 2026 - the section on identity having no backup.", "cost": "A year of saying the same thing while it feels repetitive to you and new to everyone else. What you give up is the ease of having your job answer 'so what do you do?' for you.", "unless": "If your field genuinely works on reputation inside a small market, and your pipeline is full, this is a distraction. Do the work and keep the relationships warm instead.", "do": "This week, write the sentence you would use at dinner three months after a layoff. If it is 'I am figuring things out', you have your answer about what to start.", "again": "yes", "note": "Dear reader whose Slack status is the closest thing you have to a personality.", "src": "SUBSTACK: nobody started a personal brand because they were happy, 31 May 2026", "tags": ["layoff-risk", "personal-brand", "stay-or-go", "imposter", "mid-career"]}, {"id": "S-08", "q": "Should I build a system for everything I am learning, or just keep going?", "call": "Build the smallest possible system and stop there - the system that needs maintaining becomes a second job, and the second job is the thing that kills the first one.", "how": "what is a second brain and why you need it, May 2026 - the Context Stack.", "cost": "An hour to set up and about ten minutes a week. What you give up is the pleasant feeling of organising as a substitute for making.", "unless": "If you genuinely cannot find things you wrote three months ago and it is costing you work, spend the weekend on it properly. Otherwise a note app and a weekly ten minutes is the whole answer.", "do": "This week, put everything in one place, not five. Set a ten-minute slot on Sunday to sort it. Do not buy anything.", "again": "not like that", "note": "Dear reader with notes in five apps and confidence in none of them.", "src": "SUBSTACK: what is a second brain and why you need it, 26 May 2026 - VERIFY BODY BEFORE DEMO", "tags": ["start-something", "side-project", "deciding-now", "tech", "creator"]}, {"id": "S-09", "q": "The numbers are small and nothing is happening. Should I stop?", "call": "Do not stop at month six - that is exactly where it stops being embarrassing and starts being a body of work, and almost everyone quits within a fortnight of it.", "how": "How Much Is Enough, April 2026 - on her first year, and the videos so uncomfortable she archived them.", "cost": "Several more months of feeling like nobody is reading. What you give up is the clean exit where you get to say it was not for you.", "unless": "If it has been two years, you dread every session, and nothing has come of it, stopping is a legitimate decision rather than a failure. Say it out loud to one person so it counts.", "do": "This week, decide the number of issues or posts you will finish before you allow yourself to judge it. Write the number down. Twenty is the right answer.", "again": "yes", "note": "Dear reader checking analytics at 1am and calling it a performance review.", "src": "SUBSTACK: How Much Is Enough, 5 Apr 2026", "tags": ["creator", "comparison", "stay-or-go", "deciding-now", "imposter", "burnout"]}, {"id": "S-10", "q": "My friend keeps saying she feels behind. What do I actually send her?", "call": "Send the data and one line about why it made you think of her - the sentence you write is the gift, the link is just the wrapping.", "how": "you were never behind, April 2026, which ends by asking readers to forward it to the friend who keeps texting that she feels behind.", "cost": "One minute. What you give up is nothing, which is why it is strange how rarely anyone does it.", "unless": "If she has not asked and is not ready, wait. A forwarded link at the wrong moment reads as a verdict on how she is living.", "do": "Today, forward it with one sentence: here is the bit that made me think of you. Then tell her you love her on her actual timeline.", "again": "yes", "note": "Dear reader who keeps composing this message and deleting it.", "src": "SUBSTACK: you were never behind, 14 Apr 2026", "tags": ["comparison", "am-i-behind", "no-budget", "deciding-now", "pre-decision"]}, {"id": "SC-01", "q": "I am turning 26 and people my age are becoming VPs and partners. It keeps me up at night.", "call": "You are not behind them, you are on a different fuel - the people making VP at 26 are often running on the kind that burns out by 32, and yours is the slower one that lasts.", "how": "Her own reply to a reader in the comments of you were never behind, 14 April 2026.", "cost": "Nothing in money. What it costs is the reflex - comparison is a trained habit rather than a fact, and untraining it takes a while.", "unless": "If the feeling has a specific cause you could fix - underpaid, under-titled, genuinely stuck in a dead role - then the comparison is information rather than anxiety. Act on it instead of soothing it.", "do": "This week, write the three people you are actually racing and whether you have spoken to any of them in the last year. Then be kind to yourself while the reflex untrains.", "again": "yes", "note": "Dear reader who keeps checking LinkedIn at night and feeling worse afterwards.", "src": "SUBSTACK COMMENT: Aditi's reply to a reader, 14 Apr 2026 - PASTE HER VERBATIM WORDS OVER THIS CALL", "tags": ["comparison", "am-i-behind", "mid-career", "deciding-now", "consulting", "finance"]}, {"id": "SC-02", "q": "I installed the tool and have not used it. Should I invest the time in learning it properly?", "call": "Use it on one real task this week rather than learning it in the abstract - a tool you have not pointed at your own work is just another tab.", "how": "Her AI tools breakdown, March 2026, and the comment thread under it.", "cost": "An afternoon. What you give up is the comfortable feeling of being someone who has installed the thing.", "unless": "If you have three half-learned tools already, learn none of them. Pick the one that touches work you do weekly and delete the rest.", "do": "By Friday, do one real task you would have done anyway with the tool instead. If it does not save you time on that task, stop.", "again": "yes", "note": "Dear reader who installed it a week ago and has not opened it since.", "src": "SUBSTACK COMMENT: AI tools post comment thread, Mar 2026 - VERIFY POST BODY BEFORE DEMO", "tags": ["start-something", "tech", "deciding-now", "side-project", "imposter"]}, {"id": "IG-01", "q": "My LinkedIn has not been touched in two years. Worth rewriting?", "call": "Rewrite the top third and leave the rest — the headline and first two lines are all a recruiter reads, and nothing below them gets a chance until those work.", "how": "My recruiter-ready LinkedIn post, written from my time inside LinkedIn.", "cost": "An hour. You give up the version of your profile that describes your job instead of your value.", "unless": "If you are not looking and not hiring, leave it. A profile rewritten out of anxiety reads like one.", "do": "Rewrite your headline so it says what you do for people, not your job title. Leave the rest until that line is right.", "again": "yes", "note": "For the one who has had the edit screen open twice this month.", "src": "INSTAGRAM: recruiter-ready LinkedIn post", "tags": ["visibility", "job-offer", "career-change", "deciding-now", "tech"]}, {"id": "IG-02", "q": "Which skills should I actually learn to stay employable?", "call": "Learn the two things a machine is worst at — judgement under uncertainty, and getting other people to agree — and stop collecting tools.", "how": "My post on the only skills I would ask my younger sister to learn.", "cost": "Months, not weekends. You give up the satisfying feeling of finishing a course.", "unless": "If your role is being automated on a known timeline, learn the specific replacement first. Urgency changes the order.", "do": "Pick one and practise it on work you already have to do. Not a course. A real task.", "again": "yes", "note": "For the one with four half-finished courses and a growing sense of dread.", "src": "INSTAGRAM: 'if you were my younger sister' post", "tags": ["career-change", "start-something", "tech", "deciding-now", "mid-career"]}, {"id": "IG-03", "q": "I am bad at networking. Do I actually have to?", "call": "Stop networking and start being useful to five specific people — the top of any field runs on reciprocity, not on introductions collected at events.", "how": "My post on how the top 1% network.", "cost": "About an hour a month. You give up the idea that this happens at events rather than in your inbox.", "unless": "Job hunting with a deadline? Be direct instead — ask ten people for a specific thing. Slow reciprocity is for when you have time.", "do": "Send one genuinely useful thing to five people with no ask attached. Diary the same slot next month.", "again": "yes", "note": "For the one who has been to three events and come home with nothing.", "src": "INSTAGRAM: network like the top 1% post", "tags": ["no-network", "visibility", "deciding-now", "pre-decision", "non-tech"]}, {"id": "IG-04", "q": "Should I apply to roles in Europe rather than where I am?", "call": "Apply before you move — the hiring is real and remote-friendly, and moving first turns a job search into a countdown.", "how": "My posts on Europe hiring and the new tech roles opening there.", "cost": "Applications take weeks and the timezone gymnastics are real. You give up the certainty of your current market.", "unless": "If you need a visa and have no runway, reverse it — secure the role that sponsors, then move. Do not resign on optimism.", "do": "Apply to three roles that would sponsor or hire remotely. Let the applications tell you whether the market is real for you.", "again": "not like that", "note": "For the one with European job boards open since March.", "src": "INSTAGRAM: Europe is hiring posts", "tags": ["relocate", "job-offer", "career-change", "deciding-now", "tech"]}, {"id": "IG-05", "q": "I turn 30 soon and I have not done what I meant to. What now?", "call": "Write what you actually learned instead of what you meant to achieve — the decade did not fail, the scoring system did.", "how": "My thirtieth birthday post, thirty things I would tell my younger sister.", "cost": "An evening. You give up a plan made at 22 by someone who had not met you yet.", "unless": "If there is one concrete thing you genuinely want and have not started, this is not the moment for reframing. Start it this month.", "do": "Write the five things you know now that you did not at 25. Then one thing for the next year, not the next decade.", "again": "yes", "note": "For the one doing the maths on your own birthday.", "src": "INSTAGRAM: 'I'm 30 today' post", "tags": ["comparison", "am-i-behind", "mid-career", "deciding-now", "stay-or-go", "drifting"]}], "topics": [{"id": "offers", "label": "Offers and moves", "sub": "Take it, leave it, or ask for more", "tags": ["job-offer", "stay-or-go", "negotiate", "salary", "career-change", "relocate", "post-decision", "first-90-days"], "icon": "arrows"}, {"id": "behind", "label": "Feeling behind", "sub": "Comparison, timelines, and the 3am maths", "tags": ["comparison", "am-i-behind", "imposter", "drifting", "mid-career"], "icon": "clock"}, {"id": "seen", "label": "Being seen", "sub": "Posting, profiles, and your employer", "tags": ["visibility", "personal-brand", "employer-risk", "no-network"], "icon": "eye"}, {"id": "building", "label": "Building something", "sub": "Side projects, newsletters, going out alone", "tags": ["start-something", "side-project", "side-income", "creator", "layoff-risk"], "icon": "brick"}, {"id": "money", "label": "Money and worth", "sub": "Pay, cost, and whether it is worth it", "tags": ["salary", "negotiate", "spend-money", "pay-cut", "unpaid", "no-budget", "over-2k", "500-2k", "under-500"], "icon": "coin"}, {"id": "rooms", "label": "Rooms and events", "sub": "Tickets, trips, and unpaid gigs", "tags": ["spend-money", "unpaid", "over-2k", "500-2k", "under-500", "no-network"], "icon": "door"}, {"id": "tired", "label": "Running on empty", "sub": "Burnout, dri var CLOUD=null, CLOUD_REQ=null, CLOUD_ANS=null, CLOUD_USER=null, CLOUD_READY=false;

window.PA_connect=function(api){
  CLOUD=api; CLOUD_READY=true;
  api.onUser(function(u){
    CLOUD_USER=u||null;
    if(route().p==="desk") render();
  });
  api.watch(
    function(reqs){ CLOUD_REQ=reqs; if(route().p==="desk") render(); },
    function(ans){  CLOUD_ANS=ans;  if(route().p==="answers") render(); }
  );
};

/* Answers Aditi writes live on My desk are stored here and merged into the corpus. */
function liveAnswers(){
  if(CLOUD_ANS) return CLOUD_ANS;
  return ld("pa_live",[]);
}
function deskRequests(){
  if(CLOUD_REQ) return CLOUD_REQ.slice().reverse();  /* cloud returns newest first */
  return ld("pa_req",[]);
}
function reqKey(r){return r.id||r.at}
function allCorpus(){return C.concat(liveAnswers())}
function depth(){return ld("pa_depth","full")}

function topicOf(r){
  for(var i=0;i<TOPICS.length;i++)
    if(TOPICS[i].tags.some(function(t){return r.tags.indexOf(t)>-1})) return TOPICS[i];
  return TOPICS[0];
}
function oneLiner(r){
  var s=r.call.split(/ \u2014 | - /)[0];
  if(s.length>150) s=s.slice(0,148)+"\u2026";
  return s.replace(/[,.;:]$/,"")+".";
}

  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pretty(t){return String(t).replace(/-/g," ")}
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function logReq(o){
  if(CLOUD){ try{ CLOUD.logRequest(o) }catch(e){} return }
  var q=ld("pa_req",[]); q.push(Object.assign({at:Date.now()},o)); sv("pa_req",q.slice(-400));

function byId(id){var a=allCorpus();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function score(r,t){var s=0;for(var i=0;i<t.length;i++)
  if(r.tags.indexOf(t[i])>-1)s+=(KIND.indexOf(t[i])>-1?DW:1);return s}
function rank(t){return allCorpus().map(function(r){return{row:r,s:score(r,t)}})
  .filter(function(x){return x.s>0}).sort(function(a,b){return b.s-a.s})}
function kindMatch(r,t){for(var i=0;i<t.length;i++)
  if(KIND.indexOf(t[i])>-1&&r.tags.indexOf(t[i])>-1)return true;return false}
function sure(rk,t){
  if(!rk.length) return false;
  if(rk[0].row.live) return rk[0].s>0;          /* Aditi answered this one herself */
  return rk[0].s>=FLOOR&&(!NEEDS_KIND||kindMatch(rk[0].row,t));
}
var STOP=(" the a an and or of to in on for is are was were i my me you your it this that with "+
 "should would could do does did have has had be been am at as but if so about from not no yes "+
 "what how why when where which who can will just really very much more than then them they ").split(" ");
function words(t){return String(t||"").toLowerCase().replace(/[^a-z0-9\s]/g," ")
  .split(/\s+/).filter(function(w){return w.length>2&&STOP.indexOf(w)<0})}
/* Direct wording match against answers Aditi wrote live. */
function liveMatch(text){
  var w=words(text); if(w.length<3) return null;
  var best=null,bestN=0;
  liveAnswers().forEach(function(r){
    var q=words(r.q),n=0;
    w.forEach(function(x){if(q.indexOf(x)>-1)n++});
    if(n>bestN){bestN=n;best=r}
  });
  return (bestN>=3||(bestN>=2&&bestN/Math.max(1,w.length)>=0.4))?best:null;
}
function byTags(tags){return allCorpus().filter(function(r){
  return tags.some(function(t){return r.tags.indexOf(t)>-1})})}

function spark(vals){
  if(!vals.length) vals=[0];
  var w=300,h=70,max=Math.max.apply(null,vals)||1,step=vals.length>1?w/(vals.length-1):w;
  var pts=vals.map(function(v,i){return (i*step).toFixed(1)+","+(h-(v/max)*(h-12)).toFixed(1)}).join(" ");
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Questions per day">'+
    '<polyline points="'+pts+'" fill="none" stroke="var(--crimson)" stroke-width="2"/>'+
    vals.map(function(v,i){return '<circle cx="'+(i*step).toFixed(1)+'" cy="'+
      (h-(v/max)*(h-12)).toFixed(1)+'" r="2.6" fill="var(--crimson)"/>'}).join("")+'</svg>';
}

function searchBox(ph){

function runSearch(text){
  var out=document.getElementById("qout"); if(!out) return;
  text=(text||"").trim();
  if(text.length<4){out.innerHTML='<p class="sub" style="margin-top:18px">'+
    'Tell me a bit more \u2014 a sentence is plenty.</p>';return}
  var th=detect(text), tags=th.slice(0,6).map(function(x){return x.tag});
  var lm=liveMatch(text), rk=rank(tags);
  if(!lm&&!sure(rk,tags)){out.innerHTML='<div style="margin-top:24px">'+
    missHTML(text.slice(0,90),tags)+'</div>';return}
  var r=lm||rk[0].row;
  logReq({label:text.slice(0,90),themes:tags,matched:r.id,typed:1});
  out.innerHTML='<div style="margin-top:30px;border-top:1px solid var(--rule);padding-top:26px">'+
    answerHTML(r,"You asked: "+text.slice(0,120))+
    (rk.length>1?'<h2>You might also be asking</h2>'+qcards(rk.slice(1,4).map(function(x){return x.row}),3):'')+
    '</div>';
  out.scrollIntoView({behavior:(matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"),block:"start"});
}
function wireSearch(){
  var go=document.getElementById("go"), q=document.getElementById("q"), mic=document.getElementById("mic");
  if(!go) return;
  go.addEventListener("click",function(){runSearch(q.value)});
  q.addEventListener("keydown",function(e){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();runSearch(q.value)}});
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){mic.style.display="none";return}
  var rec=null,on=false;
  mic.addEventListener("click",function(){
    if(on&&rec){rec.stop();return}
    try{
      rec=new SR();rec.lang="en-GB";rec.interimResults=true;rec.continuous=false;
      rec.onstart=function(){on=true;mic.classList.add("live")};
      rec.onend=function(){on=false;mic.classList.remove("live")};
      rec.onerror=function(){on=false;mic.classList.remove("live");toast("Could not hear that \u2014 type it instead.")};
      rec.onresult=function(e){
        var t="";for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;
        q.value=t;
        if(e.results[e.results.length-1].isFinal){runSearch(t)}
      };
      rec.start();
    }catch(err){mic.style.display="none"}
  });
}

          '<button class="btn" data-send="'+esc(reqKey(r))+'">Send</button></div>')+
        '</div>'}).join("")
    : '<div class="emptyslot">Nothing waiting. Everything that came in today, my answers already handled.</div>';

  var plans=(themes.length?themes.slice(0,2).map(function(x){return{q:"More on "+pretty(x.t),
      why:x.n+" people brought this in. You have answers on file \u2014 worth a post.",topic:x.t,n:x.n}}):[])
    .concat(GAPS.slice(0,2).map(function(g){return{q:g.q,why:g.why,topic:"gap",n:0}}));

  var banner="";
  if(!cloudOn()){
    banner='<div class="note"><b>This browser only.</b> Add your Firebase config at the bottom of '+
      'index.html and this desk shows everyone\u2019s questions, and your answers go live for everyone.</div>';
  } else if(!CLOUD_USER){
    banner='<div class="note"><b>Connected.</b> Sign in to see the queue and answer.'+
      '<span class="row" style="margin-top:10px"><button class="btn" data-signin="1">Sign in</button></span></div>';
  } else {
    banner='<div class="note"><b>Live.</b> Signed in as '+esc(CLOUD_USER.email||"you")+
      '. Every answer you send here goes out to everyone.</div>';
  }
  if(cloudOn()&&!CLOUD_USER){
    return '<div class="wrap"><p class="eyebrow">My desk \u00b7 private</p>'+
      '<h1>What people are <em>bringing me.</em></h1>'+banner+'</div>';
  }
  return '<div class="wrap"><p class="eyebrow">My desk \u00b7 private</p>'+
   '<h1>What people are <em>bringing me.</em></h1>'+
   '<p class="lede">Thirty seconds instead of two hundred DMs.</p>'+banner+
   '<div class="kpis stagger">'+
     '<div class="kpi"><b class="counter" data-to="'+reqs.length+'">0</b><span>questions brought</span></div>'+
     '<div class="kpi"><b class="counter" data-to="'+ans+'">0</b><span>answered without me</span></div>'+
     '<div class="kpi"><b class="counter" data-to="'+un+'">0</b><span>only I can answer</span></div>'+
     '<div class="kpi"><b class="counter" data-to="'+typed+'">0</b><span>typed or dictated</span></div>'+
     '<div class="kpi"><b class="counter" data-to="'+(C.length+live.length)+'">0</b><span>answers on file</span></div></div>'+
   '<div class="panels">'+
     '<div class="panel"><h3>How much of my inbox this handles</h3>'+donut(ans,un,"answered","needs me")+'</div>'+
     '<div class="panel"><h3>Questions per day, last week</h3>'+spark(series)+
       '<p class="sub" style="margin:10px 0 0">Every point is someone who would otherwise have sent a DM. '+
       evn+' arrived with a document attached.</p></div>'+
   '</div>'+
   '<h2>Waiting on me</h2>'+
   '<p class="sub">Answer it once here. It becomes an answer on the site, and the next person who asks '+
   'gets it without me.</p>'+threads+
   '<h2>What people are dealing with</h2>'+
   (themes.length?'<div class="panel">'+themes.map(function(x,i){
      return '<div class="bar"><span class="lab">'+esc(pretty(x.t))+'</span>'+
        '<span class="track"><i style="width:'+Math.max(4,Math.round(x.n/max*100))+
        '%;animation-delay:'+(i*0.05).toFixed(2)+'s"></i></span>'+
        '<span class="n">'+x.n+'</span></div>'}).join("")+'</div>'
    :'<p class="sub">Nothing yet. Ask a question on the site and this fills in.</p>')+
   '<h2>What to make next \u2014 with the steps</h2>'+
   '<p class="sub">Ranked by what people actually asked. Each one is ready to film or write.</p>'+
   '<div class="stagger">'+plans.map(function(pn){
     var pl=planFor(pn.topic==="gap"?pn.q:pn.topic,pn.n);
     return '<div class="plan"><h3>'+esc(pn.q)+'</h3><p class="why">'+esc(pn.why)+'</p>'+
       '<div class="fmt">'+pl.fmt.map(function(f){return '<span class="chip">'+esc(f)+'</span>'}).join("")+
       '<span class="chip on">'+esc(pl.where)+'</span></div>'+
       '<ol>'+pl.steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join("")+'</ol></div>'}).join("")+'</div>'+
   '<p class="row" style="margin-top:20px"><button class="btn-ghost" data-reset="1">Reset this view</button></p>'+
   '</div>';
}
function sendReply(key){
  var ta=document.querySelector('[data-replyto="'+key+'"]');
  if(!ta) return;
  var text=(ta.value||"").trim();
  if(text.length<10){toast("A sentence or two is enough.");return}
  var reqs=deskRequests(), req=null;
  for(var i=0;i<reqs.length;i++) if(String(reqKey(reqs[i]))===String(key)) req=reqs[i];
  if(!req) return;
  var id="LIVE-"+key;
  var row={id:id,q:req.label||"A question from the site",call:text,
    how:"I answered this one myself, from my desk.",
    cost:"Told you straight. No hedging.",
    unless:"Message me if your situation is different in a way I have not covered.",
    do:"Do the first thing in that answer this week.",
    again:"yes",note:"",src:"Answered live by Aditi",
    tags:((req.themes&&req.themes.length)?req.themes.slice(0,6):["deciding-now"]),live:true};

  if(CLOUD){
    ta.disabled=true;
    CLOUD.publishAnswer(row).then(function(){
      return CLOUD.markAnswered(req.id,id);
    }).then(function(){
      toast("Answered. It is live for everyone.");
    }).catch(function(err){
      ta.disabled=false;
      toast("Could not publish \u2014 check you are signed in.");
      if(window.console) console.error(err);
    });
    return;
  }

  var live=ld("pa_live",[]); live.push(row); sv("pa_live",live);
  var local=ld("pa_req",[]);
  for(var j=0;j<local.length;j++) if(String(local[j].at)===String(key)){
    local[j].matched=id; local[j].repliedWith=id;
  }
  sv("pa_req",local);
  render(); toast("Answered. It is on the site now.");
}
function animateCounters(){
  var els=document.querySelectorAll(".counter");
  var reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  for(var i=0;i<els.length;i++){(function(el){
    var to=+el.getAttribute("data-to")||0;
    if(reduce||to===0){el.textContent=to;return}
    var start=performance.now(),dur=650;
    function step(t){
      var k=Math.min(1,(t-start)/dur);
      el.textContent=Math.round(to*(1-Math.pow(1-k,3)));
      if(k<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })(els[i])}
}

/* ---------- intake ---------- */
var INTAKE=[
 {q:"What are you deciding?",opts:[
   {l:"Whether to take a job or an offer",t:["job-offer"]},
   {l:"Whether to stay or go",t:["stay-or-go"]},
   {l:"Whether to spend money on something",t:["spend-money"]},

   {l:"Whether to start something of my own",t:["start-something","side-project"]},

   {l:"Whether to move somewhere",t:["relocate"]},
   {l:"What to do now that I have decided",t:["post-decision","first-90-days"]},
   {l:"Something else \u2014 it is not on this list",t:[]}]},
 {q:"Where are you in it?",opts:[
   {l:"Thinking about it",t:["pre-decision"]},{l:"Deciding now",t:["deciding-now"]},
   {l:"Already committed",t:["already-committed"]},{l:"Just started",t:["first-90-days"]}]},
 {q:"What is in the way?",opts:[

 {q:"What can you spend on this?",opts:[
   {l:"Nothing",t:["no-budget"]},{l:"Under \u00a3500",t:["under-500"]},
